<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="request-flow-title request-flow-desc" id="request-flow-root">
      <title id="request-flow-title">Recall Relay 请求处理流程</title>
      <desc id="request-flow-desc">普通请求透传固定上游，缓存聊天优先访问上游并异步保存符合条件的回答，向客户端发出回答前遇到可降级故障时尝试历史回放，未命中时仅符合条件的 ComfyUI 提示词优化可回原文。</desc>
      <defs>
      <style>#request-flow-root { color: #2d3142; }
      #request-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#request-flow-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="request-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#4f5d75"/></marker>
        <marker id="request-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <g font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" fill="#2d3142">
        <text x="44" y="76" font-family="'Instrument Serif','Noto Serif SC','Songti SC','SimSun',serif" font-size="28" font-weight="600">请求处理流程</text>

        <!-- 先画连接线，再画节点；箭头停在节点边缘。 -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#request-flow-arrow)">
          <path d="M480 92 V130"/>
          <path d="M368 180 H266"/>
          <path d="M152 208 V294" stroke-dasharray="5 4"/>
          <path d="M592 324 H698"/>
          <path d="M480 372 V410"/>
          <path d="M368 460 H266"/>
          <path d="M592 460 H698"/>
        </g>
        <path d="M480 228 V274" fill="none" stroke="#bf4520" stroke-width="1.8" marker-end="url(#request-flow-arrow-accent)"/>

        <!-- 分支文字放在箭头旁边，留出空隙，避免遮住线。 -->
        <g font-size="12" font-weight="500" fill="#4f5d75" text-anchor="middle">
          <rect x="268" y="156" width="96" height="16" fill="#f5f5f5"/>
          <text x="316" y="169">否（含普通透传）</text>
          <rect x="160" y="240" width="120" height="16" fill="#f5f5f5"/>
          <text x="220" y="253">仅合格的完整聊天回答</text>
          <rect x="488" y="244" width="128" height="16" fill="#f5f5f5"/>
          <text x="552" y="257" fill="#bf4520">是，且尚未发出回答</text>
          <rect x="624" y="300" width="40" height="16" fill="#f5f5f5"/>
          <text x="644" y="313">命中</text>
          <rect x="488" y="384" width="56" height="16" fill="#f5f5f5"/>
          <text x="516" y="397">未命中</text>
          <rect x="296" y="436" width="40" height="16" fill="#f5f5f5"/>
          <text x="316" y="449">是</text>
          <rect x="624" y="436" width="40" height="16" fill="#f5f5f5"/>
          <text x="644" y="449">否</text>
        </g>

        <g text-anchor="middle" font-weight="600" font-size="16" stroke-width="1.4">
          <rect x="364" y="40" width="232" height="52" rx="24" fill="#ececec" stroke="#4f5d75"/>
          <text x="480" y="72">将请求转发给固定上游</text>

          <polygon points="480,132 592,180 480,228 368,180" fill="#ffffff" stroke="#4f5d75"/>
          <text x="480" y="176">缓存聊天遇到</text>
          <text x="480" y="196">可降级故障？</text>

          <rect x="40" y="152" width="224" height="56" rx="20" fill="#ffffff" stroke="#4f5d75"/>
          <text x="152" y="186">返回上游响应</text>

          <rect x="40" y="296" width="224" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-dasharray="5 4"/>
          <text x="152" y="321">后台写入历史</text>
          <text x="152" y="340" font-size="12" font-weight="500" fill="#4f5d75">Redis 热缓存 · 可选 MySQL 归档</text>

          <polygon points="480,276 592,324 480,372 368,324" fill="#f7e9e4" stroke="#bf4520" stroke-width="2"/>
          <text x="480" y="330" fill="#963819">历史缓存命中？</text>

          <rect x="700" y="296" width="220" height="56" rx="20" fill="#ffffff" stroke="#4f5d75"/>
          <text x="810" y="330">回放历史回答</text>

          <polygon points="480,412 592,460 480,508 368,460" fill="#ffffff" stroke="#4f5d75"/>
          <text x="480" y="456">符合 ComfyUI</text>
          <text x="480" y="476">提示词回退条件？</text>

          <rect x="40" y="432" width="224" height="56" rx="20" fill="#ffffff" stroke="#4f5d75"/>
          <text x="152" y="457">返回用户原提示词</text>
          <text x="152" y="476" font-size="12" font-weight="500" fill="#4f5d75">仅 Sulphur 非流式优化</text>
          <rect x="700" y="432" width="220" height="56" rx="20" fill="#ffffff" stroke="#4f5d75"/>
          <text x="810" y="466">返回相应错误</text>
        </g>
        <g fill="#4f5d75" font-size="12" font-weight="500">
          <path d="M40 540 H920" stroke="#bfc0c0"/>
          <path d="M44 566 H76" stroke="#4f5d75" stroke-width="1.6"/>
          <text x="84" y="570">当前请求</text>
          <path d="M168 566 H200" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4"/>
          <text x="208" y="570">后台写入</text>
        </g>
      </g>
    </svg>
