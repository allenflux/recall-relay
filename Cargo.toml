[package]
name = "recall-relay"
version = "0.1.0"
edition = "2024"
description = "带历史回放与模型降级的固定上游 HTTP 中继"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.7.9"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rand = "0.9"
redis = { version = "1.6", default-features = false, features = ["tokio-rustls-comp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-casefold = "0.2"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
