services:
  relay:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.compose}

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    user: "999:999"
    command: ["--datadir=/var/lib/mysql/data"]
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.compose}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recall_relay}
      MYSQL_USER: ${MYSQL_USER:-recall_relay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.compose}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute='SELECT 1' >/dev/null
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 15
    volumes:
      - mysql-data:/var/lib/mysql
    tmpfs:
      - /var/run/mysqld:uid=999,gid=999,mode=0700
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    stop_grace_period: 60s

volumes:
  mysql-data:
