apiVersion: v1
kind: ConfigMap
metadata:
  name: recall-relay-config
data:
  RELAY_BIND: "0.0.0.0:8000"
  RELAY_LOG_CONTENT: "true"
  INGRESS_ORIGIN: "http://recall-relay:8000"
  UPSTREAM_URL: "https://open-sealion.aiaigirl.com/v1/chat/completions"
  REQUEST_PATH: "/v1/chat/completions"
  POLICY_EPOCH: "history-v1"
  REDIS_PREFIX: "recall-relay:v1"
  HISTORY_NEAR_MODE: "replay"
  HISTORY_EMBEDDING_MODE: "off"
  HISTORY_EMBEDDING_MODEL: "embeddinggemma:300m-qat-q8_0"
  HISTORY_EMBEDDING_THRESHOLD: "0.90"
  HISTORY_EMBEDDING_LAST_RESORT_THRESHOLD: ""
  HISTORY_EMBEDDING_TIMEOUT_SECONDS: "0.65"
  MYSQL_HOST: "recall-relay-mysql"
  MYSQL_PORT: "3306"
  MYSQL_USER: "recall_relay"
  MYSQL_DATABASE: "recall_relay"
  TOTAL_TIMEOUT_SECONDS: "60"
  STREAM_TIMEOUT_SECONDS: "600"
  UPSTREAM_TIMEOUT_SECONDS: "55"
