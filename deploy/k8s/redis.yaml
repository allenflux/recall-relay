apiVersion: v1
kind: Service
metadata:
  name: recall-relay-redis-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: recall-relay-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: recall-relay-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: recall-relay-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recall-relay-redis
spec:
  serviceName: recall-relay-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recall-relay-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recall-relay-redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              : "${REDIS_PASSWORD:?set REDIS_PASSWORD in recall-relay-secrets}"
              exec redis-server --bind 0.0.0.0 --protected-mode yes \
                --requirepass "$REDIS_PASSWORD" --dir /data --save "" \
                --appendonly yes --appendfsync everysec \
                --maxmemory 320mb --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recall-relay-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -qx PONG']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -qx PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -qx PONG']
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
