apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-relay
  labels:
    app.kubernetes.io/name: recall-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recall-relay
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recall-relay
        app.kubernetes.io/component: relay
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 85
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-cpu-model
          image: ollama/ollama:0.31.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/recall-relay/ollama/prepare-model.sh"]
          env:
            - name: HOME
              value: /home/ollama
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: CPU_FALLBACK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: CPU_FALLBACK_ENABLED
            - name: HISTORY_NEAR_MODE
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: HISTORY_NEAR_MODE
            - name: HISTORY_EMBEDDING_MODE
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: HISTORY_EMBEDDING_MODE
            - name: HISTORY_EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: HISTORY_EMBEDDING_MODEL
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: OLLAMA_VULKAN
              value: "0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ollama-config
              mountPath: /etc/recall-relay/ollama
              readOnly: true
            - name: ollama-models
              mountPath: /models
            - name: ollama-home
              mountPath: /home/ollama
            - name: ollama-tmp
              mountPath: /tmp
      containers:
        - name: relay
          image: recall-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: recall-relay-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: recall-relay-secrets
                  key: REDIS_URL
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recall-relay-mysql-secrets
                  key: MYSQL_PASSWORD
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: ollama
          image: ollama/ollama:0.31.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "$CPU_FALLBACK_ENABLED" = true ] && [ "$HISTORY_NEAR_MODE" != off ] && [ "$HISTORY_EMBEDDING_MODE" != off ]; then
                export OLLAMA_MAX_LOADED_MODELS=2
              fi
              exec ollama serve
          env:
            - name: HOME
              value: /home/ollama
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: CPU_FALLBACK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: CPU_FALLBACK_ENABLED
            - name: HISTORY_NEAR_MODE
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: HISTORY_NEAR_MODE
            - name: HISTORY_EMBEDDING_MODE
              valueFrom:
                configMapKeyRef:
                  name: recall-relay-config
                  key: HISTORY_EMBEDDING_MODE
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: OLLAMA_VULKAN
              value: "0"
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - if [ "$CPU_FALLBACK_ENABLED" = true ]; then ollama show recall-relay-cpu:vision; else ollama list; fi
            periodSeconds: 3
            timeoutSeconds: 4
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # 先让 Relay 完成正在处理的请求，再停止本地 CPU 生成。
                command: ["/bin/sleep", "70"]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ollama-models
              mountPath: /models
            - name: ollama-home
              mountPath: /home/ollama
            - name: ollama-tmp
              mountPath: /tmp
      volumes:
        - name: ollama-config
          configMap:
            name: recall-relay-ollama
        - name: ollama-models
          emptyDir:
            sizeLimit: 2Gi
        - name: ollama-home
          emptyDir:
            sizeLimit: 16Mi
        - name: ollama-tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recall-relay
  labels:
    app.kubernetes.io/name: recall-relay
    app.kubernetes.io/component: relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: recall-relay
    app.kubernetes.io/component: relay
  ports:
    - name: http
      port: 8000
      targetPort: http
