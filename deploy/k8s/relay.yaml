apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-relay
  labels:
    app.kubernetes.io/name: recall-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recall-relay
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recall-relay
        app.kubernetes.io/component: relay
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 85
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: recall-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: recall-relay-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: recall-relay-secrets
                  key: REDIS_URL
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recall-relay-mysql-secrets
                  key: MYSQL_PASSWORD
                  optional: true
          volumeMounts:
            - name: relay-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: relay-tmp
          # 使用节点的临时磁盘，供加载 GGUF 时生成兼容副本。
          emptyDir:
            sizeLimit: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recall-relay
  labels:
    app.kubernetes.io/name: recall-relay
    app.kubernetes.io/component: relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: recall-relay
    app.kubernetes.io/component: relay
  ports:
    - name: http
      port: 8000
      targetPort: http
